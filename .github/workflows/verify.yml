name: verify-candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, 'candidate-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-candidate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      branch: ${{ steps.release.outputs.branch }}
      source: ${{ steps.release.outputs.source }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test candidate publication and promotion
        run: python3 -m unittest discover -s build/tests -v
      - id: release
        run: python3 -m build.publish_candidate context

  native-platform:
    needs: context
    if: needs.context.outputs.mode == 'verify' || needs.context.outputs.mode == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: X64
            slug: linux-amd64
          - platform: linux/arm64
            runner: ARM64
            slug: linux-arm64
    runs-on: [self-hosted, Linux, attack-harness-release, "${{ matrix.runner }}"]
    timeout-minutes: 90
    steps:
      - name: Check out harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: attack_harness
          persist-credentials: false
      - name: Check out pinned Operator source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: intrusiveai/operator_sandbox
          ref: 396a90d215e57b582ee0a71c3a0802ee2ed278f4
          path: operator_sandbox
          persist-credentials: false
      - name: Verify runner toolchain
        working-directory: attack_harness
        run: |
          test "$(python3 -c 'import platform;print(platform.python_version())')" = 3.13.15
          test "$(go version | awk '{print $3}')" = go1.26.5
          docker version --format '{{.Client.Version}}' | grep -Fx 29.0.1
          docker buildx version | grep -F 'v0.29.1'
      - name: Install locked test dependencies
        working-directory: attack_harness
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            -r requirements-runtime.lock
      - name: Verify source, contracts, and Python behavior
        working-directory: attack_harness
        run: |
          make verify-source PYTHON=.ci-venv/bin/python
          make contract-package OPERATOR_ROOT=../operator_sandbox
          make verify-contracts OPERATOR_ROOT=../operator_sandbox PYTHON=.ci-venv/bin/python
          make test OPERATOR_ROOT=../operator_sandbox PYTHON=.ci-venv/bin/python
      - name: Verify Go and Python process integration
        working-directory: attack_harness
        run: |
          make -C ../operator_sandbox test-integration PYTHON="$(pwd)/.ci-venv/bin/python"
      - name: Start pinned BuildKit
        working-directory: attack_harness
        run: |
          docker buildx create --name "harness-${{ github.run_id }}-${{ matrix.slug }}" \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.25.2@sha256:0f63d66f8d2de0bd16438284831a3e9ee6ca7cd57b6eb3ed6e38a7a456590fa7 \
            --use
          docker buildx inspect --bootstrap | grep -F 'BuildKit version: v0.25.2'
      - name: Build twice and compare runtime identity
        working-directory: attack_harness
        run: |
          make image PLATFORM=${{ matrix.platform }} OPERATOR_ROOT=../operator_sandbox PYTHON=.ci-venv/bin/python
          cp dist/attack-harness-${{ matrix.slug }}.build-report.json dist/first-build-report.json
          make image PLATFORM=${{ matrix.platform }} OPERATOR_ROOT=../operator_sandbox PYTHON=.ci-venv/bin/python
          .ci-venv/bin/python build/compare_builds.py \
            --first dist/first-build-report.json \
            --second dist/attack-harness-${{ matrix.slug }}.build-report.json \
            --output dist/attack-harness-${{ matrix.slug }}.rebuild-comparison.json
      - name: Exercise Operator stopped-image inspection and cleanup
        working-directory: attack_harness
        run: |
          make inspect-stopped-image PLATFORM=${{ matrix.platform }} \
            OPERATOR_ROOT=../operator_sandbox PYTHON=.ci-venv/bin/python
      - name: Remove ephemeral builder
        if: always()
        run: docker buildx rm "harness-${{ github.run_id }}-${{ matrix.slug }}" || true
      - name: Retain inspected candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attack-harness-${{ matrix.slug }}-candidate
          path: |
            attack_harness/dist/attack-harness-${{ matrix.slug }}.oci.tar
            attack_harness/dist/attack-harness-${{ matrix.slug }}.build-report.json
            attack_harness/dist/attack-harness-${{ matrix.slug }}.rebuild-comparison.json
            attack_harness/dist/attack-harness-${{ matrix.slug }}.inspection-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [context, native-platform]
    if: needs.context.outputs.mode == 'publish' && github.repository == 'intrusiveai/attack_harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: write # Download build artifacts and dispatch approval at the candidate tag.
    concurrency:
      group: attack-harness-registry-publication
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          docker buildx version
      - name: Download this run's inspected OCI archives
        run: |
          gh run download "$GITHUB_RUN_ID" --name attack-harness-linux-amd64-candidate --dir dist/publication
          gh run download "$GITHUB_RUN_ID" --name attack-harness-linux-arm64-candidate --dir dist/publication
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/harness-registry
        run: |
          printf 'DOCKER_CONFIG=%s\nREGISTRY_AUTH_FILE=%s/config.json\n' "$DOCKER_CONFIG" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish candidate and request per-platform approval
        env:
          CANDIDATE_BRANCH: ${{ needs.context.outputs.branch }}
          CANDIDATE_SOURCE: ${{ needs.context.outputs.source }}
          GATE_STATUS: ${{ needs.native-platform.result }}
        run: |
          python3 -m build.publish_candidate publish --directory dist/publication \
            --branch "$CANDIDATE_BRANCH" --source "$CANDIDATE_SOURCE" --gate-status "$GATE_STATUS"
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io

  promote:
    needs: context
    if: needs.context.outputs.mode == 'promote' && github.repository == 'intrusiveai/attack_harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      pull-requests: read
    concurrency:
      group: attack-harness-registry-publication
      cancel-in-progress: false
      queue: max
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/harness-registry
        run: |
          printf 'DOCKER_CONFIG=%s\nREGISTRY_AUTH_FILE=%s/config.json\n' "$DOCKER_CONFIG" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote the merged candidate's approved image
        env:
          RELEASE_PR: ${{ needs.context.outputs.pr }}
        run: python3 -m build.publish_candidate promote --pr "$RELEASE_PR"
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
