name: publish release catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attack-harness-catalog
  cancel-in-progress: false
  queue: max

jobs:
  entry:
    if: github.repository == 'intrusiveai/attack_harness' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      json: ${{ steps.entry.outputs.entry_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OCI inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Verify the generated catalog entry against the public release
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m build.publish_candidate catalog-context

  publish:
    needs: entry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: tools/release-publisher
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONTENT_BUCKET: ${{ vars.CONTENT_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      GOWORK: 'off'
      GOPROXY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release-publisher/go.mod
          cache-dependency-path: tools/release-publisher/go.mod
      - name: Validate catalog entry before assuming AWS role
        env:
          ENTRY_JSON: ${{ needs.entry.outputs.json }}
        run: |
          printf '%s\n' "$ENTRY_JSON" > "$RUNNER_TEMP/catalog-entry.json"
          go run ./cmd/catalog-publisher catalog merge --product attack_harness \
            --entry "$RUNNER_TEMP/catalog-entry.json" --output "$RUNNER_TEMP/validated-catalog.json"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CATALOG_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Publish catalog entry and verify public delivery
        run: bash scripts/publish-catalog.sh "$RUNNER_TEMP/catalog-entry.json" attack_harness
