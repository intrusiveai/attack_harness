name: approve candidate for Operator QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approve-candidate-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  evidence:
    if: github.repository == 'intrusiveai/attack_harness' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.evidence.outputs.matrix }}
      evidence_url: ${{ steps.evidence.outputs.evidence_url }}
      image_reference: ${{ steps.evidence.outputs.image_reference }}
      index_digest: ${{ steps.evidence.outputs.index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify actual candidate build gates and assemble records
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m build.publish_candidate approval-context

  approve:
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evidence.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: tools/release-publisher
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CONTENT_BUCKET: ${{ vars.CONTENT_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      GOWORK: 'off'
      GOPROXY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/release-publisher/go.mod
          cache-dependency-path: tools/release-publisher/go.mod
      - name: Verify candidate identity and public build evidence
        env:
          RECORD_JSON: ${{ matrix.record_json }}
          EVIDENCE_URL: ${{ needs.evidence.outputs.evidence_url }}
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_REFERENCE: ${{ needs.evidence.outputs.image_reference }}
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_MANIFEST_DIGEST: ${{ matrix.platform_manifest_digest }}
          IMAGE_CONFIG_DIGEST: ${{ matrix.image_config_digest }}
          INDEX_DIGEST: ${{ needs.evidence.outputs.index_digest }}
        run: bash scripts/prepare-record.sh "$RUNNER_TEMP/candidate-record.json"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RECORD_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Publish immutable record and verify public delivery
        run: bash scripts/publish-record.sh "$RUNNER_TEMP/candidate-record.json"
