[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intrusiveai-attack-harness"
version = "0.1.0.dev1"
description = "Container guest for Operator's typed campaign protocol"
requires-python = ">=3.12"
dependencies = ["operator-contracts==0.0.0.dev1"]

[tool.setuptools.packages.find]
where = ["src"]
